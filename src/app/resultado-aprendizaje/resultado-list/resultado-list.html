<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
  <div>
    <div style="font-size:22px; font-weight:700;">Resultados de Aprendizaje</div>
    <div style="font-size:13px; color:var(--gray-text); margin-top:2px;">Resultados asociados a cada asignatura</div>
  </div>
  <a class="btn btn--primary" routerLink="/resultado-aprendizaje/nuevo">+ Nuevo Resultado</a>
</div>

<div *ngIf="cargando" style="padding: 24px; color: var(--gray-text);">Cargando resultados...</div>

<table class="syllabus-table" *ngIf="!cargando">
  <thead>
    <tr>
      <th>Descripción</th>
      <th>Asignatura</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let r of resultados">
      <td>{{ r.descripcion }}</td>
      <td>{{ r.asignatura?.nombreAsignatura }}</td>
      <td style="white-space:nowrap; text-align:right;">
        <span class="add-link" (click)="editar(r.idResultado)">Editar</span>
        &nbsp;·&nbsp;
        <span class="remove-btn" (click)="eliminar(r.idResultado)">Eliminar</span>
      </td>
    </tr>
  </tbody>
</table>

<div class="pagination" *ngIf="!cargando">
  <div>Mostrando {{ resultados.length }} resultados</div>
</div>
