<form [formGroup]="form" (ngSubmit)="guardar()">

  <div style="margin-bottom:20px;">
    <a routerLink="/resultado-aprendizaje" style="font-size:12px; color:var(--blue);">‹ Volver al listado</a>
    <div style="font-size:22px; font-weight:700; margin-top:8px;">
      {{ isNew ? 'Nuevo Resultado de Aprendizaje' : 'Editar Resultado de Aprendizaje' }}
    </div>
  </div>

  <div class="card">
    <div class="card__title">Información del resultado</div>

    <div class="form-field" style="margin-bottom:16px;">
      <label>Asignatura</label>
      <select formControlName="idAsignatura">
        <option [ngValue]="null" disabled>Selecciona una asignatura...</option>
        <option *ngFor="let a of asignaturas" [ngValue]="a.idAsignatura">
          {{ a.nombreAsignatura }}
        </option>
      </select>
    </div>

    <div class="form-field">
      <label>Descripción</label>
      <textarea formControlName="descripcion" rows="4"
        style="width:100%; border:1px solid var(--gray-border); border-radius:6px; padding:12px; font-size:13px; font-family:inherit;"
        placeholder="Ej. Aplica el paradigma orientado a objetos en el desarrollo de software"></textarea>
    </div>
  </div>

  <div class="form-actions">
    <a class="btn btn--ghost" routerLink="/resultado-aprendizaje">Cancelar</a>
    <button type="submit" class="btn btn--primary">Guardar</button>
  </div>

</form>
