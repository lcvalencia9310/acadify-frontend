<ng-container *ngIf="syllabus$ | async as syllabus">

  <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px;">
    <div>
      <a routerLink="/syllabus" style="font-size:12px; color:var(--blue);">‹ Volver al listado</a>
      <div style="font-size:22px; font-weight:700; margin-top:8px;">{{ syllabus.asignatura?.nombreAsignatura }}</div>
      <div style="font-size:13px; color:var(--gray-text); margin-top:2px;">
        {{ syllabus.asignatura?.creditos }} créditos · {{ syllabus.asignatura?.intensidadHoraria }} horas
      </div>
    </div>
    <a class="btn btn--outline" [routerLink]="['/syllabus', syllabus.idSyllabus, 'editar']">Editar</a>
  </div>

  <div class="card">
    <div class="card__title">Descripción</div>
    <div>{{ syllabus.descripcion || 'Sin descripción registrada.' }}</div>
  </div>

  <div class="card">
    <div class="card__title">Fecha de creación</div>
    <div>{{ syllabus.fechaCreacion }}</div>
  </div>

</ng-container>
