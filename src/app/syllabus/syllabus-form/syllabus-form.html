<form [formGroup]="form" (ngSubmit)="guardar()">

  <div style="margin-bottom:20px;">
    <a routerLink="/syllabus" style="font-size:12px; color:var(--blue);">‹ Volver al listado</a>
    <div style="font-size:22px; font-weight:700; margin-top:8px;">
      {{ isNew ? 'Nuevo Syllabus' : 'Editar Syllabus' }}
    </div>
  </div>

  <div class="card">
    <div class="card__title">Información del syllabus</div>
    <div class="form-grid">
      <div class="form-field">
        <label>Nombre de la asignatura</label>
        <input formControlName="nombreAsignatura" placeholder="Ej. Programación Orientada a Objetos" />
      </div>
      <div class="form-field">
        <label>Programa académico</label>
        <input formControlName="programaAcademico" placeholder="Ej. Análisis y Desarrollo de Software" />
      </div>
      <div class="form-field">
        <label>Créditos</label>
        <input type="number" formControlName="creditos" min="1" />
      </div>
      <div class="form-field">
        <label>Intensidad horaria</label>
        <input type="number" formControlName="intensidadHoraria" min="1" />
      </div>
    </div>
    <div class="form-field" style="margin-top:16px;">
      <label>Descripción</label>
      <textarea formControlName="descripcion" rows="4"
        style="width:100%; border:1px solid var(--gray-border); border-radius:6px; padding:12px; font-size:13px; font-family:inherit;"></textarea>
    </div>
  </div>

  <div class="form-actions">
    <a class="btn btn--ghost" routerLink="/syllabus">Cancelar</a>
    <button type="submit" class="btn btn--primary">Guardar</button>
  </div>

</form>
